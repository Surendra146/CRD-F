services:
  mongo:
    image: mongo:7
    container_name: cbdp-mongo
    profiles: ["dev", "test", "prod"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cbdp
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend-dev:
    build:
      context: ../../node/CBDP_node
      dockerfile: Dockerfile
      target: dev
    container_name: cbdp-backend-dev
    profiles: ["dev"]
    environment:
      NODE_ENV: development
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/cbdp_dev
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "5001:5001"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - ../../node/CBDP_node:/app
      - backend_node_modules:/app/node_modules
      - backend_uploads:/app/uploads
    command: npm run dev

  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: cbdp-frontend-dev
    profiles: ["dev"]
    environment:
      VITE_BACKEND_URL: http://localhost:5001
    ports:
      - "5173:5173"
    depends_on:
      - backend-dev
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173

  backend-test:
    build:
      context: ../../node/CBDP_node
      dockerfile: Dockerfile
      target: test
    container_name: cbdp-backend-test
    profiles: ["test"]
    environment:
      NODE_ENV: test
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/cbdp_test
      CORS_ORIGINS: http://localhost:5173
    depends_on:
      mongo:
        condition: service_healthy
    command: npm run test:ci

  frontend-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    container_name: cbdp-frontend-test
    profiles: ["test"]
    environment:
      VITE_BACKEND_URL: http://backend-test:5001
    depends_on:
      - backend-test
    command: npm run test:ci

  backend-prod:
    build:
      context: ../../node/CBDP_node
      dockerfile: Dockerfile
      target: production
    container_name: cbdp-backend-prod
    profiles: ["prod"]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      MONGODB_URI: mongodb://mongo:27017/cbdp_prod
      CORS_ORIGINS: http://localhost
    expose:
      - "5001"
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: cbdp-frontend-prod
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend-prod

volumes:
  mongo_data:
  frontend_node_modules:
  backend_node_modules:
  backend_uploads:
