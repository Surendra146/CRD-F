name: cbd

x-backend-build: &backend-build
  context: ${BACKEND_PATH:-../../Python/CBD_Python}
  dockerfile: Dockerfile

x-backend-environment: &backend-environment
  DATABASE_URL: postgresql+psycopg://cbd:${POSTGRES_PASSWORD:?Run npm run docker:init first}@postgres:5432/cm_db
  JWT_SECRET: ${JWT_SECRET:?Run npm run docker:init first}
  JWT_ALGORITHM: HS256
  JWT_EXPIRES_MINUTES: "1440"
  AUTO_CREATE_TABLES: "true"
  REDIS_URL: redis://redis:6379/0
  ENABLE_REDIS_PROGRESS: "true"
  ENABLE_SOCKET_PROGRESS: "true"
  CORS_ORIGINS: http://localhost,http://localhost:${FRONTEND_PORT:-80},http://localhost:5173,http://127.0.0.1:5173

x-backend-dependencies: &backend-dependencies
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    profiles: [dev, prod]
    restart: unless-stopped
    environment:
      POSTGRES_DB: cm_db
      POSTGRES_USER: cbd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run npm run docker:init first}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:7-alpine
    profiles: [dev, prod]
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-dev:
    profiles: [dev]
    env_file:
      - ${BACKEND_PATH:-../../Python/CBD_Python}/.env
    build:
      <<: *backend-build
      target: dev
    environment:
      <<: *backend-environment
      ENVIRONMENT: development
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ${BACKEND_PATH:-../../Python/CBD_Python}/app:/app/app
    depends_on: *backend-dependencies

  frontend-dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    environment:
      VITE_BACKEND_URL: /
      VITE_API_URL: /
      VITE_ENABLE_SOCKET_PROGRESS: "true"
      DOCKER_BACKEND_URL: http://backend-dev:8000
      DOCKER_WATCH_POLLING: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      backend-dev:
        condition: service_healthy

  backend-prod:
    profiles: [prod]
    env_file:
      - ${BACKEND_PATH:-../../Python/CBD_Python}/.env
    build:
      <<: *backend-build
      target: production
    restart: unless-stopped
    environment:
      <<: *backend-environment
      ENVIRONMENT: production
      ENABLE_SOCKET_PROGRESS: "false"
    expose:
      - "8000"
    depends_on: *backend-dependencies

  frontend-prod:
    profiles: [prod]
    build:
      context: .
      target: production
      args:
        VITE_BACKEND_URL: /
        VITE_API_URL: /
        VITE_ENABLE_SOCKET_PROGRESS: "false"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend-prod:
        condition: service_healthy

  backend-test:
    profiles: [test]
    build:
      <<: *backend-build
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://cbd:test@localhost:5432/cm_db
      ENABLE_REDIS_PROGRESS: "false"
      ENABLE_SOCKET_PROGRESS: "true"

  frontend-test:
    profiles: [test]
    build:
      context: .
      target: test
    environment:
      VITE_BACKEND_URL: /
      VITE_API_URL: /
      VITE_ENABLE_SOCKET_PROGRESS: "true"

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
